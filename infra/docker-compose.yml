name: medflow

# 本地依赖：MySQL 8.4 LTS + Redis 8
# 应用本体默认以开发模式运行（pnpm web:start / ./mvnw spring-boot:run）。
# 需要一键完整环境时：docker compose --profile full up -d --build

services:
  mysql:
    image: mysql:8.4
    container_name: medflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medflow_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medflow}
      MYSQL_USER: ${MYSQL_USER:-medflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-medflow}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: medflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:5
    container_name: medflow-adminer
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DEFAULT_DRIVER: server
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: medflow-api
    profiles: ["full"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-medflow-demo-secret-at-least-32-bytes}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: medflow-web
    profiles: ["full"]
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
